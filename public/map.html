<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Preston Regeneration Map</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    #sidebar {
      width: 320px; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid #e0e0e0; background: #fafafa;
    }
    #sidebar h1 {
      font-size: 14px; font-weight: 600; letter-spacing: .03em;
      padding: 14px 16px; border-bottom: 1px solid #e0e0e0;
      color: #333; text-transform: uppercase; flex-shrink: 0;
    }

    /* Search bar */
    #search-bar {
      padding: 10px 16px; border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0; background: #fafafa; position: relative;
    }
    #search-input {
      width: 100%; padding: 7px 30px 7px 10px; font-size: 13px;
      border: 1px solid #ddd; border-radius: 4px; background: #fff;
      color: #333; outline: none; transition: border-color .15s;
    }
    #search-input:focus { border-color: #e74c3c; }
    #search-clear {
      position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
      font-size: 16px; color: #bbb; cursor: pointer; display: none;
      line-height: 1; background: none; border: none; padding: 0;
    }
    #search-clear:hover { color: #888; }

    /* Date filter bar */
    #filter-bar {
      display: flex; gap: 6px; padding: 10px 16px;
      border-bottom: 1px solid #e0e0e0; flex-shrink: 0;
      background: #fafafa;
    }
    .filter-btn {
      flex: 1; padding: 5px 0; font-size: 12px; font-weight: 500;
      border: 1px solid #ddd; border-radius: 4px;
      background: #fff; color: #555; cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .filter-btn:hover   { background: #f0f0f0; }
    .filter-btn.active  { background: #e74c3c; color: #fff; border-color: #e74c3c; }

    #post-list { flex: 1; overflow-y: auto; }

    /* Category section headers */
    .cat-section { border-bottom: 2px solid #e0e0e0; }
    .cat-section-header {
      padding: 10px 16px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      background: #f0f0f0; user-select: none;
      transition: background .15s;
    }
    .cat-section-header:hover { background: #e8e8e8; }
    .cat-section-label {
      flex: 1; font-size: 12px; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase; color: #444;
    }
    .cat-section-count {
      font-size: 11px; font-weight: 600; color: #fff;
      border-radius: 10px; padding: 1px 7px; flex-shrink: 0;
    }
    .cat-section-chevron { font-size: 9px; color: #999; transition: transform .2s; flex-shrink: 0; }
    .cat-section-header.open .cat-section-chevron { transform: rotate(90deg); }
    .cat-section-body { display: none; }
    .cat-section-body.open { display: block; }

    /* Location rows */
    .loc-item { border-bottom: 1px solid #ececec; }
    .loc-header {
      padding: 10px 16px 10px 24px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: background .15s;
    }
    .loc-header:hover  { background: #f0f0f0; }
    .loc-header.active { background: #fdecea; border-left: 3px solid #e74c3c; padding-left: 21px; }
    .loc-meta  { flex: 1; min-width: 0; }
    .loc-name  { font-size: 13px; font-weight: 500; color: #222; line-height: 1.4; }
    .loc-date  { font-size: 11px; color: #aaa; margin-top: 2px; }
    .loc-count {
      font-size: 11px; font-weight: 600; color: #fff;
      border-radius: 10px; padding: 1px 7px; flex-shrink: 0;
    }
    .loc-chevron { font-size: 9px; color: #bbb; transition: transform .2s; flex-shrink: 0; }
    .loc-header.open .loc-chevron { transform: rotate(90deg); }

    /* Article sub-list */
    .article-list { display: none; border-top: 1px solid #ececec; }
    .article-list.open { display: block; }
    .article-list a {
      display: block; padding: 8px 16px 8px 36px;
      font-size: 12px; color: #444; text-decoration: none;
      border-bottom: 1px solid #f0f0f0; line-height: 1.4;
    }
    .article-list a:last-child { border-bottom: none; }
    .article-list a:hover { background: #f0f0f0; color: #111; }
    .article-date { font-size: 11px; color: #aaa; margin-top: 2px; }

    /* Empty state */
    #empty-state {
      display: none; padding: 32px 16px;
      text-align: center; color: #aaa; font-size: 13px;
    }

    /* Shared dot */
    .cat-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; flex-shrink: 0;
    }

    /* Map */
    #map-wrap { flex: 1; position: relative; }
    #map { position: absolute; inset: 0; }
    .mapboxgl-popup-content { font-size: 13px; line-height: 1.5; }
    .mapboxgl-popup-content strong { display: block; margin-bottom: 6px; }
    .mapboxgl-popup-content .article-links { max-height: 200px; overflow-y: auto; }
    .art-item { padding: 7px 0; border-bottom: 1px solid #f0f0f0; }
    .art-item:last-child { border-bottom: none; }
    .art-title { font-size: 12px; font-weight: 500; color: #222; line-height: 1.4; }
    .art-date  { display: block; font-size: 11px; color: #aaa; margin-top: 2px; }
    .art-excerpt {
      display: block; color: #666; font-size: 11px;
      line-height: 1.5; margin-top: 3px;
    }
    .art-link {
      display: inline-block; margin-top: 5px;
      font-size: 11px; font-weight: 600;
      color: #e74c3c; text-decoration: none;
    }
    .art-link:hover { text-decoration: underline; }

    #legend {
      position: absolute; bottom: 32px; left: 12px; z-index: 1;
      background: #fff; border-radius: 6px; padding: 10px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.2); font-size: 13px; line-height: 2;
    }
    .legend-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; flex-shrink: 0;
    }
    .legend-checkbox {
      appearance: none; -webkit-appearance: none;
      width: 13px; height: 13px; flex-shrink: 0;
      border: 2px solid var(--cb-color, #999);
      border-radius: 3px; cursor: pointer; margin: 0;
      background: var(--cb-color, #999); position: relative;
      transition: background .15s, border-color .15s;
    }
    .legend-checkbox::after {
      content: ''; position: absolute;
      left: 2px; top: -1px; width: 5px; height: 8px;
      border: 2px solid #fff; border-top: none; border-left: none;
      transform: rotate(45deg);
    }
    .legend-checkbox:not(:checked) { background: transparent; border-color: #ccc; }
    .legend-checkbox:not(:checked)::after { display: none; }
    .legend-item {
      display: flex; align-items: center; gap: 7px;
      padding: 3px 0; cursor: pointer; user-select: none; line-height: 1.6;
    }
    .legend-item:hover { opacity: 0.8; }
    .legend-item.hidden .legend-label { color: #bbb; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>Locations <span id="loc-count" style="font-weight:400;color:#888"></span></h1>
    <div id="search-bar">
      <input id="search-input" type="search" placeholder="Search locations…" autocomplete="off" />
      <button id="search-clear" title="Clear search">&#x2715;</button>
    </div>
    <div id="filter-bar">
      <button class="filter-btn active" data-days="">All</button>
      <button class="filter-btn" data-days="365">1 year</button>
      <button class="filter-btn" data-days="180">6 months</button>
      <button class="filter-btn" data-days="30">30 days</button>
    </div>
    <div id="post-list">
      <div id="empty-state">No articles found for this period.</div>
    </div>
  </div>

  <div id="map-wrap">
    <div id="map"></div>
    <div id="legend">
      <label class="legend-item" data-category="regeneration"><input type="checkbox" class="legend-checkbox" data-category="regeneration" checked style="--cb-color:#e74c3c"><span class="legend-dot" style="background:#e74c3c"></span><span class="legend-label">Regeneration</span></label>
      <label class="legend-item" data-category="proposed"><input type="checkbox" class="legend-checkbox" data-category="proposed" checked style="--cb-color:#f39c12"><span class="legend-dot" style="background:#f39c12"></span><span class="legend-label">Proposed</span></label>
      <label class="legend-item" data-category="landmark"><input type="checkbox" class="legend-checkbox" data-category="landmark" checked style="--cb-color:#3498db"><span class="legend-dot" style="background:#3498db"></span><span class="legend-label">Landmark</span></label>
      <label class="legend-item" data-category="area"><input type="checkbox" class="legend-checkbox" data-category="area" checked style="--cb-color:#27ae60"><span class="legend-dot" style="background:#27ae60"></span><span class="legend-label">Area</span></label>
    </div>
  </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <script>
    const CATEGORY_COLOURS = {
      regeneration: '#e74c3c',
      proposed:     '#f39c12',
      landmark:     '#3498db',
      area:         '#27ae60',
    };
    const CATEGORY_LABELS = {
      regeneration: 'Regeneration',
      proposed:     'Proposed',
      landmark:     'Landmark',
      area:         'Area',
    };
    const CATEGORY_ORDER = ['regeneration', 'proposed', 'landmark', 'area'];

    let activePopup      = null;
    let activeHeader     = null;
    let currentGeojson   = null;
    let map              = null;
    let hiddenCategories = new Set();

    function getVisibleFeatures(query) {
      if (!currentGeojson) return [];
      const q = (query ?? '').trim().toLowerCase();
      return currentGeojson.features.filter(f => {
        if (hiddenCategories.has(f.properties.category)) return false;
        if (q && !f.properties.location.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function toggleCategory(cat, isChecked) {
      if (isChecked) hiddenCategories.delete(cat); else hiddenCategories.add(cat);
      document.querySelector(`.legend-item[data-category="${cat}"]`)
        ?.classList.toggle('hidden', !isChecked);
      applySearch(document.getElementById('search-input')?.value ?? '');
    }

    function applySearch(query) {
      const q    = query.trim().toLowerCase();
      const list = document.getElementById('post-list');

      list.querySelectorAll('.cat-section').forEach(section => {
        const cat = section.dataset.category;
        if (hiddenCategories.has(cat)) { section.style.display = 'none'; return; }
        let visible = 0;
        section.querySelectorAll('.loc-item').forEach(item => {
          const name = item.querySelector('.loc-name').textContent.toLowerCase();
          const show = !q || name.includes(q);
          item.style.display = show ? '' : 'none';
          if (show) visible++;
        });
        section.style.display = visible ? '' : 'none';
      });

      const matched = getVisibleFeatures(query);
      map?.getSource('posts')?.setData({ type: 'FeatureCollection', features: matched });

      if (matched.length) {
        const bounds = new mapboxgl.LngLatBounds();
        matched.forEach(f => bounds.extend(f.geometry.coordinates));
        map?.fitBounds(bounds, { padding: 60, maxZoom: 15 });
      }

      document.getElementById('search-clear').style.display = q ? 'block' : 'none';
    }

    function plainText(html) {
      if (!html) return '';
      const div = document.createElement('div');
      div.innerHTML = html;
      return (div.textContent || div.innerText || '').trim();
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d      = new Date(iso.slice(0, 10) + 'T00:00:00');
      const day    = d.getDate();
      const month  = d.toLocaleDateString('en-GB', { month: 'long' });
      const year   = d.getFullYear();
      const s      = day % 100;
      const suffix = (s >= 11 && s <= 13) ? 'th'
        : { 1: 'st', 2: 'nd', 3: 'rd' }[day % 10] ?? 'th';
      return `${day}${suffix} ${month} ${year}`;
    }

    function sinceDate(days) {
      if (!days) return null;
      const d = new Date();
      d.setDate(d.getDate() - parseInt(days));
      return d.toISOString().slice(0, 10);
    }

    function buildSidebar(geojson, list, map) {
      // Clear previous state — wipe the list entirely then re-add the empty state node
      list.innerHTML = '';
      const empty = document.createElement('div');
      empty.id = 'empty-state';
      empty.style.display = 'none';
      empty.textContent = 'No articles found for this period.';
      list.appendChild(empty);
      if (activePopup)  { activePopup.remove();  activePopup  = null; }
      if (activeHeader) { activeHeader.classList.remove('active'); activeHeader = null; }

      document.getElementById('loc-count').textContent = `(${geojson.features.length})`;

      if (!geojson.features.length) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      // Group by category
      const grouped = {};
      CATEGORY_ORDER.forEach(c => grouped[c] = []);
      geojson.features.forEach((f, i) => {
        const cat = f.properties.category;
        if (grouped[cat]) grouped[cat].push({ f, i });
      });

      CATEGORY_ORDER.forEach(cat => {
        const items = grouped[cat];
        if (!items.length) return;

        const colour        = CATEGORY_COLOURS[cat];
        const totalArticles = items.reduce((sum, { f }) => sum + f.properties.count, 0);

        const section = document.createElement('div');
        section.className = 'cat-section';
        section.dataset.category = cat;
        if (hiddenCategories.has(cat)) section.style.display = 'none';

        const sectionHeader = document.createElement('div');
        sectionHeader.className = 'cat-section-header open';
        sectionHeader.innerHTML = `
          <span class="cat-dot" style="background:${colour}"></span>
          <span class="cat-section-label">${CATEGORY_LABELS[cat]}</span>
          <span class="cat-section-count" style="background:${colour}">${totalArticles}</span>
          <span class="cat-section-chevron">&#9654;</span>`;

        const sectionBody = document.createElement('div');
        sectionBody.className = 'cat-section-body open';

        sectionHeader.addEventListener('click', () => {
          const opening = !sectionBody.classList.contains('open');
          sectionBody.classList.toggle('open', opening);
          sectionHeader.classList.toggle('open', opening);
        });

        items.forEach(({ f, i }) => {
          const { location, count, articles: articlesJson } = f.properties;
          const articles   = JSON.parse(articlesJson);
          const latestDate = formatDate(articles[0]?.date);

          const item = document.createElement('div');
          item.className = 'loc-item';
          item.dataset.index = i;

          const header = document.createElement('div');
          header.className = 'loc-header';
          header.innerHTML = `
            <div class="loc-meta">
              <div class="loc-name">${location}</div>
              <div class="loc-date">${latestDate}</div>
            </div>
            <span class="loc-count" style="background:${colour}">${count}</span>
            <span class="loc-chevron">&#9654;</span>`;

          const articleList = document.createElement('div');
          articleList.className = 'article-list';
          articles.forEach(a => {
            const link = document.createElement('a');
            link.href = a.link;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.innerHTML = `${a.title}<div class="article-date">${formatDate(a.date)}</div>`;
            articleList.appendChild(link);
          });

          header.addEventListener('click', () => {
            const opening = !articleList.classList.contains('open');
            articleList.classList.toggle('open', opening);
            header.classList.toggle('open', opening);
            flyTo(map, f, header, sectionHeader, sectionBody);
          });

          item.appendChild(header);
          item.appendChild(articleList);
          sectionBody.appendChild(item);
        });

        section.appendChild(sectionHeader);
        section.appendChild(sectionBody);
        list.appendChild(section);
      });
    }

    async function refresh(map, list, since) {
      const locCount = document.getElementById('loc-count');
      locCount.textContent = '(loading…)';
      try {
        const url      = since ? `/posts/geo?since=${since}` : '/posts/geo';
        const res      = await fetch(url);
        currentGeojson = await res.json();
        buildSidebar(currentGeojson, list, map);
        const visibleAfterRefresh = getVisibleFeatures(document.getElementById('search-input')?.value ?? '');
        map.getSource('posts')?.setData({ type: 'FeatureCollection', features: visibleAfterRefresh });
        if (visibleAfterRefresh.length) {
          const bounds = new mapboxgl.LngLatBounds();
          visibleAfterRefresh.forEach(f => bounds.extend(f.geometry.coordinates));
          map.fitBounds(bounds, { padding: 60, maxZoom: 15 });
        }
      } catch (err) {
        locCount.textContent = '(error)';
        console.error('[refresh] failed:', err);
      }
    }

    async function init() {
      const { accessToken } = await fetch('/map').then(r => r.json());
      mapboxgl.accessToken = accessToken;

      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v11',
        center: [-2.7038, 53.7589], // fallback — overridden by fitBounds once data loads
        zoom: 12,
      });

      map.addControl(new mapboxgl.NavigationControl(), 'top-right');

      map.on('load', async () => {
        const list = document.getElementById('post-list');

        // Initial load
        currentGeojson = await fetch('/posts/geo').then(r => r.json());
        buildSidebar(currentGeojson, list, map);

        if (currentGeojson.features.length) {
          const bounds = new mapboxgl.LngLatBounds();
          currentGeojson.features.forEach(f => bounds.extend(f.geometry.coordinates));
          map.fitBounds(bounds, { padding: 60, maxZoom: 15 });
        }

        map.addSource('posts', { type: 'geojson', data: currentGeojson, cluster: true, clusterMaxZoom: 13 });

        map.addLayer({
          id: 'clusters',
          type: 'circle',
          source: 'posts',
          filter: ['has', 'point_count'],
          paint: {
            'circle-color': '#888',
            'circle-radius': ['step', ['get', 'point_count'], 16, 5, 22, 20, 28],
            'circle-opacity': 0.6,
          },
        });

        map.addLayer({
          id: 'cluster-count',
          type: 'symbol',
          source: 'posts',
          filter: ['has', 'point_count'],
          layout: { 'text-field': '{point_count_abbreviated}', 'text-size': 12 },
          paint: { 'text-color': '#fff' },
        });

        map.addLayer({
          id: 'posts-circles',
          type: 'circle',
          source: 'posts',
          filter: ['!', ['has', 'point_count']],
          paint: {
            'circle-radius': ['interpolate', ['linear'], ['get', 'count'], 1, 7, 10, 13, 20, 17],
            'circle-color': [
              'match', ['get', 'category'],
              'regeneration', '#e74c3c',
              'proposed',     '#f39c12',
              'landmark',     '#3498db',
              'area',         '#27ae60',
              '#999',
            ],
            'circle-stroke-width': 2,
            'circle-stroke-color': '#fff',
          },
        });

        // Search
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        searchInput.addEventListener('input', () => applySearch(searchInput.value));
        searchClear.addEventListener('click', () => {
          searchInput.value = '';
          applySearch('');
        });

        // Category visibility toggles (legend checkboxes)
        document.querySelectorAll('.legend-checkbox[data-category]').forEach(cb => {
          cb.addEventListener('change', () => toggleCategory(cb.dataset.category, cb.checked));
        });

        // Filter bar — clear search when switching date range
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            searchInput.value = '';
            searchClear.style.display = 'none';
            refresh(map, list, sinceDate(btn.dataset.days));
          });
        });

        // Map interactions
        map.on('click', 'posts-circles', e => {
          const props = e.features[0].properties;
          const idx   = currentGeojson.features.findIndex(f => f.properties.location === props.location);
          const item  = list.querySelector(`[data-index="${idx}"]`);
          if (!item) return;
          // If item is hidden by search, clear search first
          if (item.style.display === 'none') {
            document.getElementById('search-input').value = '';
            applySearch('');
          }
          const headerEl      = item.querySelector('.loc-header');
          const sectionBody   = item.closest('.cat-section-body');
          const sectionHeader = item.closest('.cat-section')?.querySelector('.cat-section-header');
          flyTo(map, currentGeojson.features[idx], headerEl, sectionHeader, sectionBody);
        });

        map.on('click', 'clusters', e => {
          const [feature] = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
          map.getSource('posts').getClusterExpansionZoom(feature.properties.cluster_id, (err, zoom) => {
            if (!err) map.easeTo({ center: feature.geometry.coordinates, zoom });
          });
        });

        map.on('mouseenter', 'posts-circles', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'posts-circles', () => map.getCanvas().style.cursor = '');
        map.on('mouseenter', 'clusters',      () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'clusters',      () => map.getCanvas().style.cursor = '');
      });
    }

    function flyTo(map, feature, headerEl, sectionHeader, sectionBody) {
      const { location, articles: articlesJson } = feature.properties;
      const articles = JSON.parse(articlesJson);
      const coords   = feature.geometry.coordinates;

      if (activePopup)  activePopup.remove();
      if (activeHeader) activeHeader.classList.remove('active');

      if (sectionBody && !sectionBody.classList.contains('open')) {
        sectionBody.classList.add('open');
        sectionHeader?.classList.add('open');
      }

      map.flyTo({ center: coords, zoom: Math.max(map.getZoom(), 15), speed: 1.4 });

      const links = articles.map(a => {
        const excerpt = plainText(a.excerpt);
        const short   = excerpt.length > 140 ? excerpt.slice(0, 140).trimEnd() + '…' : excerpt;
        return `<div class="art-item">
          <div class="art-title">${a.title}</div>
          <span class="art-date">${formatDate(a.date)}</span>
          ${short ? `<span class="art-excerpt">${short}</span>` : ''}
          <a href="${a.link}" class="art-link" target="_blank" rel="noopener noreferrer">Read article &#8594;</a>
        </div>`;
      }).join('');

      activePopup = new mapboxgl.Popup({ maxWidth: '320px' })
        .setLngLat(coords)
        .setHTML(`<strong>${location}</strong><div class="article-links">${links}</div>`)
        .addTo(map);

      if (headerEl) {
        headerEl.classList.add('active');
        headerEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        activeHeader = headerEl;
      }
    }

    init();
  </script>
</body>
</html>
