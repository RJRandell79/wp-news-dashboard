<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Preston Regeneration Map</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    #sidebar {
      width: 320px; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid #e0e0e0; background: #fafafa;
    }
    #sidebar h1 {
      font-size: 14px; font-weight: 600; letter-spacing: .03em;
      padding: 14px 16px; border-bottom: 1px solid #e0e0e0;
      color: #333; text-transform: uppercase; flex-shrink: 0;
    }
    #post-list { flex: 1; overflow-y: auto; }

    /* Location rows */
    .loc-item { border-bottom: 1px solid #ececec; }
    .loc-header {
      padding: 11px 16px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: background .15s;
    }
    .loc-header:hover  { background: #f0f0f0; }
    .loc-header.active { background: #fdecea; border-left: 3px solid #e74c3c; padding-left: 13px; }
    .loc-name  { flex: 1; font-size: 13px; font-weight: 500; color: #222; line-height: 1.4; }
    .loc-count {
      font-size: 11px; font-weight: 600; color: #fff;
      border-radius: 10px; padding: 1px 7px; flex-shrink: 0;
    }
    .loc-chevron { font-size: 9px; color: #bbb; transition: transform .2s; flex-shrink: 0; }
    .loc-header.open .loc-chevron { transform: rotate(90deg); }

    /* Article sub-list */
    .article-list { display: none; border-top: 1px solid #ececec; }
    .article-list.open { display: block; }
    .article-list a {
      display: block; padding: 8px 16px 8px 30px;
      font-size: 12px; color: #444; text-decoration: none;
      border-bottom: 1px solid #f0f0f0; line-height: 1.4;
    }
    .article-list a:last-child { border-bottom: none; }
    .article-list a:hover { background: #f0f0f0; color: #111; }
    .article-date { font-size: 11px; color: #aaa; margin-top: 2px; }

    /* Dot used in both sidebar and legend */
    .cat-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; flex-shrink: 0;
    }

    /* Map */
    #map-wrap { flex: 1; position: relative; }
    #map { position: absolute; inset: 0; }
    .mapboxgl-popup-content { font-size: 13px; line-height: 1.5; }
    .mapboxgl-popup-content strong { display: block; margin-bottom: 6px; }
    .mapboxgl-popup-content .article-links { max-height: 200px; overflow-y: auto; }
    .mapboxgl-popup-content .article-links a {
      display: block; color: #e74c3c; text-decoration: none;
      padding: 3px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px;
    }
    .mapboxgl-popup-content .article-links a:last-child { border: none; }
    .mapboxgl-popup-content .article-links a:hover { text-decoration: underline; }
    .mapboxgl-popup-content .article-links .art-date { color: #aaa; font-size: 11px; }

    #legend {
      position: absolute; bottom: 32px; left: 12px; z-index: 1;
      background: #fff; border-radius: 6px; padding: 10px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.2); font-size: 13px; line-height: 2;
    }
    .legend-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; margin-right: 6px; vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>Locations <span id="loc-count" style="font-weight:400;color:#888"></span></h1>
    <div id="post-list"></div>
  </div>

  <div id="map-wrap">
    <div id="map"></div>
    <div id="legend">
      <span class="legend-dot" style="background:#e74c3c"></span>Regeneration<br>
      <span class="legend-dot" style="background:#f39c12"></span>Proposed<br>
      <span class="legend-dot" style="background:#3498db"></span>Landmark<br>
      <span class="legend-dot" style="background:#27ae60"></span>Area
    </div>
  </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <script>
    const CATEGORY_COLOURS = {
      regeneration: '#e74c3c',
      proposed:     '#f39c12',
      landmark:     '#3498db',
      area:         '#27ae60',
    };

    let activePopup  = null;
    let activeHeader = null;

    async function init() {
      const { accessToken } = await fetch('/map').then(r => r.json());
      mapboxgl.accessToken = accessToken;

      const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v11',
        center: [-2.7038, 53.7589],
        zoom: 14,
      });

      map.addControl(new mapboxgl.NavigationControl(), 'top-right');

      map.on('load', async () => {
        const geojson = await fetch('/posts/geo').then(r => r.json());
        const list    = document.getElementById('post-list');

        document.getElementById('loc-count').textContent = `(${geojson.features.length})`;

        // Build sidebar
        geojson.features.forEach((f, i) => {
          const { location, category, count, articles: articlesJson } = f.properties;
          const articles = JSON.parse(articlesJson);
          const colour   = CATEGORY_COLOURS[category] ?? '#999';

          const item = document.createElement('div');
          item.className = 'loc-item';
          item.dataset.index = i;

          const header = document.createElement('div');
          header.className = 'loc-header';
          header.innerHTML = `
            <span class="cat-dot" style="background:${colour}"></span>
            <span class="loc-name">${location}</span>
            <span class="loc-count" style="background:${colour}">${count}</span>
            <span class="loc-chevron">&#9654;</span>`;

          const articleList = document.createElement('div');
          articleList.className = 'article-list';
          articles.forEach(a => {
            const link = document.createElement('a');
            link.href = a.link;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.innerHTML = `${a.title}<div class="article-date">${a.date.slice(0, 10)}</div>`;
            articleList.appendChild(link);
          });

          header.addEventListener('click', () => {
            const opening = !articleList.classList.contains('open');
            articleList.classList.toggle('open', opening);
            header.classList.toggle('open', opening);
            flyTo(map, f, header);
          });

          item.appendChild(header);
          item.appendChild(articleList);
          list.appendChild(item);
        });

        // Map layers
        map.addSource('posts', { type: 'geojson', data: geojson, cluster: true, clusterMaxZoom: 13 });

        map.addLayer({
          id: 'clusters',
          type: 'circle',
          source: 'posts',
          filter: ['has', 'point_count'],
          paint: {
            'circle-color': '#888',
            'circle-radius': ['step', ['get', 'point_count'], 16, 5, 22, 20, 28],
            'circle-opacity': 0.6,
          },
        });

        map.addLayer({
          id: 'cluster-count',
          type: 'symbol',
          source: 'posts',
          filter: ['has', 'point_count'],
          layout: { 'text-field': '{point_count_abbreviated}', 'text-size': 12 },
          paint: { 'text-color': '#fff' },
        });

        map.addLayer({
          id: 'posts-circles',
          type: 'circle',
          source: 'posts',
          filter: ['!', ['has', 'point_count']],
          paint: {
            // Radius scales with article count: 1 article → 7px, 10 → 13px, 20+ → 17px
            'circle-radius': ['interpolate', ['linear'], ['get', 'count'], 1, 7, 10, 13, 20, 17],
            'circle-color': [
              'match', ['get', 'category'],
              'regeneration', '#e74c3c',
              'proposed',     '#f39c12',
              'landmark',     '#3498db',
              'area',         '#27ae60',
              '#999',
            ],
            'circle-stroke-width': 2,
            'circle-stroke-color': '#fff',
          },
        });

        map.on('click', 'posts-circles', e => {
          const props = e.features[0].properties;
          const idx   = geojson.features.findIndex(f => f.properties.location === props.location);
          const headerEl = list.querySelector(`[data-index="${idx}"] .loc-header`);
          flyTo(map, geojson.features[idx], headerEl);
        });

        map.on('click', 'clusters', e => {
          const [feature] = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
          map.getSource('posts').getClusterExpansionZoom(feature.properties.cluster_id, (err, zoom) => {
            if (!err) map.easeTo({ center: feature.geometry.coordinates, zoom });
          });
        });

        map.on('mouseenter', 'posts-circles', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'posts-circles', () => map.getCanvas().style.cursor = '');
        map.on('mouseenter', 'clusters',      () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'clusters',      () => map.getCanvas().style.cursor = '');
      });
    }

    function flyTo(map, feature, headerEl) {
      const { location, articles: articlesJson } = feature.properties;
      const articles = JSON.parse(articlesJson);
      const coords   = feature.geometry.coordinates;

      if (activePopup)  activePopup.remove();
      if (activeHeader) activeHeader.classList.remove('active');

      map.flyTo({ center: coords, zoom: Math.max(map.getZoom(), 15), speed: 1.4 });

      const links = articles.map(a =>
        `<a href="${a.link}" target="_blank" rel="noopener noreferrer">
          ${a.title}
          <span class="art-date">${a.date.slice(0, 10)}</span>
        </a>`
      ).join('');

      activePopup = new mapboxgl.Popup({ maxWidth: '320px' })
        .setLngLat(coords)
        .setHTML(`<strong>${location}</strong><div class="article-links">${links}</div>`)
        .addTo(map);

      if (headerEl) {
        headerEl.classList.add('active');
        headerEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        activeHeader = headerEl;
      }
    }

    init();
  </script>
</body>
</html>
